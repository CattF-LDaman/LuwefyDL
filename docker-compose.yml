services:
  luwefydl:
    build: .
    user: "0:0"
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DOCKER: "1"
      MUSIC_LIBRARY_PATH: /data/music
      PORT: "8080"
      SHOW_BROWSER: "false"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - ./data/music:/data/music
      - ./temp:/app/temp
